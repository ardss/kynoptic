name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Wave18：仪表盘 1500+ 行内嵌 JS 无任何语法检查——曾因重复 const 声明
      # 整页死掉多轮没人发现（cargo test 只断言 HTML 含字符串，不执行 JS）
      - name: Dashboard JS syntax check
        shell: bash
        run: node scripts/check-js.mjs
      # 工程规范 R3.1：文档版本一致性随每个 PR 校验（bump/CHANGELOG/文档漂移
      # 在合并前拦截，不等到发版）。本机 skill 副本检查在 CI 上自动跳过。
      - name: Doc version consistency
        shell: bash
        run: node scripts/check-doc-version.mjs
