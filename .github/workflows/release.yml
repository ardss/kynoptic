name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # P2: 缓存 cargo 依赖/构建产物，加速发版构建
      - uses: Swatinem/rust-cache@v2
      # P0: 版本双源校验——tag 与 crates/cli/Cargo.toml 的 version 不一致直接失败
      - name: Verify tag matches Cargo.toml version
        shell: pwsh
        run: |
          $tagVer = $env:GITHUB_REF_NAME.TrimStart("v")
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $cargoVer = ($meta.packages | Where-Object { $_.name -eq "kynoptic" }).version
          if ($cargoVer -ne $tagVer) {
            Write-Error "tag v$tagVer 与 Cargo.toml 版本 $cargoVer 不一致，终止发版"
            exit 1
          }
          Write-Host "version check ok: v$tagVer == $cargoVer"
      # ci 修复：构建时注入指纹（git hash + 构建时间），/api/status 暴露，
      # 审查/排障先比对运行态与源码版本，杜绝「源码已修、运行态未修」脱节
      - name: Build release
        shell: pwsh
        run: |
          $env:KYNOPTIC_GIT_HASH = $env:GITHUB_SHA
          $env:KYNOPTIC_BUILD_TIME = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          Write-Host "build fingerprint: $env:KYNOPTIC_GIT_HASH @ $env:KYNOPTIC_BUILD_TIME"
          cargo build --release -p kynoptic -p kynoptic-tray
      # ci 修复：陈旧产物防线——交付的每个 exe 必须不早于最新源码，
      # 否则终止发版（先重跑构建）。拦住旧构建混入发布/升级产物。
      - name: Reject stale build artifacts
        shell: pwsh
        run: node scripts/check-fresh-build.mjs target/release kynoptic.exe kynoptic-watchdog.exe kynoptic-tray.exe kynoptic-aggrepair.exe kynoptic-ctl.exe
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # runner 预装 InnoSetup 6.x 时直接用（choco 锁版本会与预装冲突）
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Fetch Chinese language file for Inno Setup
        shell: pwsh
        run: |
          # pin 到 issrc release tag is-6_7_3 的具体 commit（4adf37ed7f3fd2bd11c6836ba056e3de170fbabf），
          # 避免上游 main 漂移破坏构建。升级 isl 时必须手动更新这里的 commit pin。
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/4adf37ed7f3fd2bd11c6836ba056e3de170fbabf/Files/Languages/Unofficial/ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
      - name: Stage assets
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/kynoptic.exe dist/kynoptic.exe
          Copy-Item target/release/kynoptic-watchdog.exe dist/kynoptic-watchdog.exe
          Copy-Item target/release/kynoptic-tray.exe dist/kynoptic-tray.exe
          Copy-Item target/release/kynoptic-aggrepair.exe dist/kynoptic-aggrepair.exe
          Copy-Item target/release/kynoptic-ctl.exe dist/kynoptic-ctl.exe
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue
          # SKILL.md 随 release 分发（自更新会拉取并刷新到 exe 目录，见 update.rs）
          Copy-Item crates/cli/src/assets/skill.md dist/SKILL.md
          # 便携版 zip
          Compress-Archive -Path dist/* -DestinationPath "dist/Kynoptic-Portable-$ver.zip"
          # 安装器（Inno Setup，双语向导）
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver kynoptic.iss
          # 自更新专用压缩包（历史资产命名 {bin}-{version}-{target}.zip）。
          # P0：必须包含三件套（kynoptic.exe / kynoptic-tray.exe / kynoptic-watchdog.exe），
          # 只换主 exe 会造成三件套版本漂移。
          Compress-Archive -Path dist/kynoptic.exe, dist/kynoptic-tray.exe, dist/kynoptic-watchdog.exe `
            -DestinationPath "dist/kynoptic-$ver-x86_64-pc-windows-msvc.zip"
          # 校验和（LF 行尾，sha256sum -c 在 Linux/macOS 也可用；覆盖全部 dist 文件，含五件套与自更新 zip）
          # 注意：自更新（update.rs）下载的是上面 files 清单里的五个裸 exe 资产，
          # 任何一个缺失都会让 `kynoptic update` 的资产完整性校验失败。
          $hashes = Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          $sums = ($hashes -join "`n") + "`n"
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", $sums)
      # ci 修复：dist 版本一致性防线——dist 里的 exe 与安装包版本必须等于
      # Cargo.toml 版本，否则终止发版（拦住「源码已发 0.3.0、产物还是 0.2.x」）
      - name: Verify dist version matches Cargo.toml
        run: node scripts/check-dist-version.mjs dist
      # ci 修复：安装器版本一致性门禁——真实静默安装到临时目录后运行
      # kynoptic.exe --version，断言与包名一致（拦住「包名 0.2.1、二进制
      # 自报 0.2.0」型版本漂移，iss 头部注释记载过同型历史事故）。
      # runner 为一次性环境，安装产生的计划任务/Run 值在步末显式清理。
      - name: Install installer to temp dir and verify binary version matches package
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          $tmp = Join-Path $env:RUNNER_TEMP "kynoptic-vercheck"
          $p = Start-Process -FilePath "dist/Kynoptic-Setup-$ver.exe" `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$tmp" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $vout = (& "$tmp/kynoptic.exe" --version) -join " "
          Write-Host "kynoptic.exe --version -> '$vout' (package version $ver)"
          if ($vout -notlike "*$ver*") { throw "version mismatch: package $ver, binary reports '$vout'" }
          # 清理一次性 runner 上的安装副作用（不清理也会随 runner 销毁，这里显式做）
          schtasks /Delete /F /TN "Kynoptic Watchdog" 2>$null | Out-Null
          Remove-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" `
            -Name "Kynoptic" -ErrorAction SilentlyContinue
      - name: Write release notes
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag.TrimStart("v")
          $notes = @"
          ## Kynoptic $ver - Windows activity tracker, 100% local

          **Download and run [Kynoptic-Setup-$ver.exe](https://github.com/ardss/kynoptic/releases/download/$tag/Kynoptic-Setup-$ver.exe)** - that is the only file most users need.

          - SmartScreen will warn (unsigned build): click **More info -> Run anyway**, or verify ``SHA256SUMS.txt`` / build from source.
          - Data stays on your machine: raw events are append-only, never uploaded, never auto-deleted.
          - After install, find the tray icon (may be in the ^ overflow) and right-click -> Open Dashboard.
          - AI integration: `kynoptic mcp` (stdio) or `kynoptic skill install` - see README.

          Other assets: portable zip (no installer), bare exes, SHA256SUMS.txt.
          "@
          Set-Content -Path dist/RELEASE_NOTES.md -Value $notes -Encoding UTF8
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/kynoptic.exe
            dist/kynoptic-watchdog.exe
            dist/kynoptic-tray.exe
            dist/kynoptic-ctl.exe
            dist/kynoptic-aggrepair.exe
            dist/SKILL.md
            dist/Kynoptic-Portable-*.zip
            dist/Kynoptic-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/kynoptic-*-x86_64-pc-windows-msvc.zip
