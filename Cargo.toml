[workspace.package]
version = "0.9.0"
rust-version = "1.85"

[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/mcp",
    "crates/tray",
    "crates/dash",
    "crates/browser-host",
]

# workspace 根定义 profile（成员 crate 内的 profile 会被忽略）
[profile.release]
opt-level = 3
lto = true
strip = true

[workspace.lints.rust]
warnings = "deny"
