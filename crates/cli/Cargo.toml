[package]
name = "kynoptic"
version = "0.1.0"
edition = "2021"
description = "命令行工具:统计/导出/报告/分析/数据库维护"

[[bin]]
name = "kynoptic"
path = "src/main.rs"

[dependencies]
kynoptic-core = { path = "../core" }
chrono = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
csv = "1"
winreg = "0.52"
log = "0.4"
env_logger = "0.11"

[lints]
workspace = true
