[package]
name = "kynoptic-browser-host"
version.workspace = true
edition = "2021"
description = "Kynoptic Chrome native messaging host: receives extension events and writes them into the kynoptic events table"

[lib]
name = "kynoptic_browser_host"
path = "src/lib.rs"

[[bin]]
name = "kynoptic-browser-host"
path = "src/main.rs"

[dependencies]
kynoptic-core = { path = "../core" }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
windows-sys = { version = "0.59", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
] }

[lints]
workspace = true
