[package]
name = "kynoptic-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server（stdio JSON-RPC 2.0，五工具，见 mcp-tool-spec-v1）"

[dependencies]
kynoptic-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
log = "0.4"

[lints]
workspace = true
