[package]
name = "kynoptic-tray"
version = "0.1.0"
edition = "2021"
description = "托盘壳:单进程内采集器 + 本地 dashboard 服务 + 系统托盘图标(纯 Win32,无 web 框架)"

[[bin]]
name = "kynoptic-tray"
path = "src/main.rs"

[dependencies]
kynoptic-core = { path = "../core" }
kynoptic-mcp = { path = "../mcp" }
kynoptic-dash = { path = "../dash" }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
serde_json = "1"
log = "0.4"

winreg = "0.52"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
